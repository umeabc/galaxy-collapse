<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c13">
  <title>galaxy-collapse · B 站 → GameKee 发布台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238b5cf6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3C/svg%3E">
  <script>
    // 主题尽早应用，避免首屏闪烁。
    (function () {
      try {
        var stored = localStorage.getItem('gc-theme');
        var theme = stored || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) { /* 隐私模式下忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/queue" aria-label="galaxy-collapse 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <defs>
              <linearGradient id="brandGradient" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a78bfa"/>
                <stop offset="1" stop-color="#22d3ee"/>
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="13" stroke="url(#brandGradient)" stroke-width="2.4"/>
            <path d="M20 7a13 13 0 0 0 0 26 9 9 0 0 1 0-26Z" fill="url(#brandGradient)" opacity=".65"/>
            <circle cx="30.5" cy="11" r="2.4" fill="#22d3ee"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>galaxy-collapse</strong>
          <small>B 站 → GameKee</small>
        </span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-link" href="#/queue" data-route="queue">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 12h11M4 18h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="19" cy="12" r="2" fill="currentColor"/>
            <circle cx="15" cy="18" r="2" fill="currentColor"/>
          </svg>
          <span>队列</span>
          <em class="nav-hint">Queue</em>
        </a>
        <a class="nav-link" href="#/drafts" data-route="drafts">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 3.8h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M14 3.9V8h4M9 12h6M9 15.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>草稿</span>
          <em class="nav-hint">Drafts</em>
        </a>
        <a class="nav-link" href="#/logs" data-route="logs">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="15" rx="2.4" stroke="currentColor" stroke-width="1.7"/>
            <path d="m7.5 10 2.6 2.6-2.6 2.6M12.8 15.2h3.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>日志</span>
          <em class="nav-hint">Logs</em>
        </a>
        <a class="nav-link" href="#/manual" data-route="manual">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            <rect x="3.4" y="3.4" width="17.2" height="17.2" rx="4.4" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
          </svg>
          <span>手工加入</span>
          <em class="nav-hint">Compose</em>
        </a>
        <a class="nav-link" href="#/settings" data-route="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="15" cy="7" r="2.1" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="9" cy="17" r="2.1" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span>设置</span>
          <em class="nav-hint">Settings</em>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="status-stack" id="status-chips" aria-live="polite"></div>
        <div class="runtime">
          <span class="runtime-dot" aria-hidden="true"></span>
          <span>LOCAL · 127.0.0.1</span>
          <span class="runtime-version">v0.1</span>
        </div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <a class="mobile-brand" href="#/queue" aria-label="galaxy-collapse">
          <span class="mobile-mark" aria-hidden="true"></span>
          <span>galaxy-collapse</span>
        </a>
        <div class="crumb" id="crumb" aria-live="polite">发布队列</div>
        <div class="topbar-right">
          <span class="env-pill"><i class="env-dot" aria-hidden="true"></i>LOCAL</span>
          <button class="icon-btn" id="theme-toggle" type="button" data-action="toggle-theme" aria-label="切换明暗主题" title="切换明暗主题">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <main id="view" aria-live="polite"></main>
    </div>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="assertive" aria-atomic="true"></div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-heading">
          <span class="modal-kicker">WORKSPACE</span>
          <h3 id="modal-title">详情</h3>
        </div>
        <div class="spacer"></div>
        <button class="btn ghost sm" data-action="modal-close">关闭 ✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
